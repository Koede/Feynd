<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Standard Model · Feynman Diagrams from the rules | loops, colour flow &amp; hadrons</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* the background is the vacuum sea drawn by js/vacuum.js on a fixed canvas */
    body { background: #f6f4ec; background-image: none; }
    .typed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 0 14px; }
    .typed-row label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #2b6b5c; }
    .typed-row input { flex: 1 1 320px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px dashed #b9c3bd; background: rgba(255,255,255,.75); font: 14px ui-monospace, Menlo, Consolas, monospace; color: #1b221c; }
    .typed-row input:focus { outline: 2px solid #1f5e8e; outline-offset: 1px; }
    .typed-go { border: 1px solid #1f5e8e; background: #1f5e8e; color: #fff; border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 13px; cursor: pointer; }
    .sqrt-s { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin-right: 12px; }
    .sqrt-s input { width: 82px; padding: 4px 6px; border-radius: 8px; border: 1px solid #c9d2d8; font: inherit; }
    .colour-row { display: none; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
    body.colour-mode .colour-row { display: flex; }
    .cbtn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid #c9d2d8; background: #fff; border-radius: 999px; padding: 2px 8px 2px 4px; font: 12px/1.3 inherit; cursor: pointer; color: #1b221c; }
    .cbtn i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); display: inline-block; }
    .cbtn:hover { border-color: var(--c, #1f5e8e); }
    .cbtn.add { padding: 2px 10px; }
    .ceditor { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-left: 4px; }
    .csel { font: 12px inherit; padding: 1px 2px; border-radius: 6px; border: 1px solid #c9d2d8; background: #fff; font-weight: 600; }
    .clab { font-size: 11px; color: #5b6770; margin-left: 2px; }
    .cpair { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .cdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 1px; vertical-align: -1px; }
    .colour-legend { display: none; }
    body.colour-mode .colour-legend { display: inline-flex; align-items: center; gap: 2px; }
    .particle-chip .ceditor { margin-left: 6px; }
    .mode-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; margin-right: 12px; }
    .mode-toggle input { accent-color: #1f5e8e; }
    .loop-opts { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 2px 10px; margin-right: 12px; border-left: 2px solid #1f5e8e33; }
    .loop-opts[hidden] { display: none; }
    #loopResults { display: block; margin-top: 8px; }
    .channel-canvas.quark-level { height: auto; aspect-ratio: auto; background: #fff; border-radius: 8px; }
    .ef-view { display: flex; gap: 0; margin: 4px 0 10px; border: 1px solid #c9d2d8; border-radius: 999px; overflow: hidden; width: max-content; max-width: 100%; }
    .ef-view button { border: 0; background: transparent; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; color: #34424c; }
    .ef-view button.on { background: #1b221c; color: #fff; }
    .ef { display: grid; gap: 8px; }
    .ef-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; align-items: start; }
    .ef-list[hidden], .ef[hidden] { display: none; }
    .tab-view > .ef-view, .tab-view > .ef, .tab-view > .ef-list { grid-column: 1 / -1; }
    .ef-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .ef-tab { border: 1px solid #c9d2d8; background: rgba(255,255,255,.6); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; color: #26323a; }
    .ef-tab span { color: #6b7780; margin-left: 2px; }
    .ef-tab.on { border-color: #1f5e8e; background: #e3edf5; color: #12354f; font-weight: 600; }
    .ef-stage { position: relative; border: 1px dashed #c9d2d8; border-radius: 14px; background: rgba(255,255,255,.55); }
    .ef-canvas { display: block; width: 100%; height: 360px; cursor: grab; touch-action: none; border-radius: 14px; }
    .ef-canvas:focus-visible { outline: 2px solid #1f5e8e; outline-offset: 2px; }
    .ef-axes { position: absolute; left: 12px; bottom: 8px; font-size: 11px; color: #6b7780; letter-spacing: .03em; pointer-events: none; }
    .ef-tip { position: absolute; z-index: 5; max-width: 260px; pointer-events: none; opacity: 0; transition: opacity .1s; background: #fff; border: 1px solid #c9d2d8; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; color: #1b221c; box-shadow: 0 8px 22px rgba(0,0,0,.15); }
    .ef-tip.on { opacity: 1; }
    .ef-tip span { color: #4b5862; }
    .ef-note { margin: 0; font-size: 12.5px; color: #4b5862; max-width: 60ch; }
    .ef-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #4b5862; }
    .ef-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    .ef-legend .dot.live { background: #2b6b5c; }
    .ef-charm { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; margin-left: auto; }
    .ef-legend .dot.ghost { border: 1.4px solid #9aa5ad; background: #fff; }
    @media (prefers-reduced-motion: reduce) { .ef-tip { transition: none; } }
    .channel-canvas.no-diagram { padding: 18px 14px; font-size: 13px; color: #5b6770; border: 1px dashed #c9d2d8; }
  </style>
</head>
<body>
  <!-- LEFT PANEL: the particle tabs are built by js/ui.js from particles.js and hadrons.js -->
  <div class="left-panel">
    <div class="title-box">
      <h1>
        <i class="fas fa-atom"></i> Feynman Diagram Generator
        <small>built from the Feynman rules</small>
      </h1>
    </div>
  </div>

  <!-- RIGHT SIDE: Feynman diagram generator -->
  <div class="right-panel">
    <div class="feynman-prebox">
      <div class="preset-row">
        <span class="preset-label">Elementary :</span>
        <div class="preset-buttons">
          <button class="preset-btn" data-preset="moller">e⁻ e⁻ → e⁻ e⁻</button>
          <button class="preset-btn" data-preset="annihilation">e⁻ e⁺ → μ⁻ μ⁺</button>
          <button class="preset-btn" data-preset="compton">e⁻ γ → e⁻ γ</button>
          <button class="preset-btn" data-preset="bhabha">e⁻ e⁺ → e⁻ e⁺</button>
          <button class="preset-btn" data-preset="pair-production">e⁻ e⁺ → γ γ</button>
          <button class="preset-btn" data-preset="muon-decay">μ⁻ decay</button>
          <button class="preset-btn" data-preset="gluon4">g g → g g</button>
          <button class="preset-btn" data-preset="higgs-gg">h → γ γ (loop)</button>
          <button class="preset-btn" data-preset="light-by-light">γ γ → γ γ (loop)</button>
        </div>
      </div>
      <div class="preset-row hadron-presets">
        <span class="preset-label">Hadronic :</span>
        <div class="preset-buttons">
          <button class="preset-btn" data-preset="pion-decay">π⁺ → μ⁺ ν<sub>μ</sub></button>
          <button class="preset-btn" data-preset="pion-radiative">π⁰ → γ γ</button>
          <button class="preset-btn" data-preset="neutron-beta">n → p e⁻ ν̄<sub>e</sub></button>
          <button class="preset-btn" data-preset="kaon-decay">K⁺ → μ⁺ ν<sub>μ</sub></button>
          <button class="preset-btn" data-preset="lambda-decay">Λ → p π⁻</button>
          <button class="preset-btn" data-preset="omega-decay">Ω⁻ → Λ K⁻</button>
          <button class="preset-btn" data-preset="ee-to-pions">e⁻ e⁺ → π⁺ π⁻</button>
          <button class="preset-btn" data-preset="delta-decay" title="strong decay">Δ⁺⁺ → p π⁺</button>
          <button class="preset-btn" data-preset="phi-decay" title="strong, OZI-allowed">φ → K⁺ K⁻</button>
          <button class="preset-btn" data-preset="sigma0-decay" title="electromagnetic decay">Σ⁰ → Λ γ</button>
          <button class="preset-btn" data-preset="dstar-decay" title="strong decay">D*⁺ → D⁰ π⁺</button>
          <button class="preset-btn" data-preset="d0-decay" title="weak, Cabibbo-favoured">D⁰ → K⁻ π⁺</button>
          <button class="preset-btn" data-preset="jpsi-decay" title="electromagnetic annihilation">J/ψ → μ⁻ μ⁺</button>
          <button class="preset-btn" data-preset="b-decay" title="weak, b → c">B⁻ → D⁰ π⁻</button>
          <button class="preset-btn" data-preset="lambdab-decay" title="weak, b → c">Λb⁰ → Λc⁺ π⁻</button>
          <button class="preset-btn" data-preset="pion-search">π⁺ · all decays</button>
          <button class="preset-btn" data-preset="rho-search">ρ⁰ · all decays</button>
        </div>
      </div>
    </div>

    <div class="feynman-box">
      <div class="typed-row">
        <label for="typedProcess">Type a process</label>
        <input type="text" id="typedProcess" autocomplete="off" spellcheck="false" placeholder="e- e+ -> mu- mu+   ·   Omega- -> Lambda K-   ·   u:r ubar:g -> g:rg gamma">
        <button type="button" class="typed-go" id="typedGo">Build</button>
      </div>
      <div class="input-panel">
        <div class="state-group" id="initialStateGroup">
          <label>Initial state <span class="clear-zone" data-zone="initial"><i class="fas fa-times-circle"></i> clear</span></label>
          <div class="drop-zone" id="initialDropZone"></div>
          <div class="placeholder-text">Click a particle on the left, or drag it here…</div>
        </div>
        <div class="state-arrow" aria-hidden="true">
          <i class="fas fa-arrow-right"></i>
        </div>
        <div class="state-group" id="finalStateGroup">
          <label>Final state <span class="clear-zone" data-zone="final"><i class="fas fa-times-circle"></i> clear</span></label>
          <div class="drop-zone" id="finalDropZone"></div>
          <div class="placeholder-text">Leave empty to discover all possible outcomes, or click to specify them</div>
        </div>

        <div class="generate-controls">
          <label class="mode-toggle" title="Also build loop diagrams: every correction at the chosen loop order, and processes that only start at one loop">
            <input type="checkbox" id="allowLoops"> <span>Allow loop diagrams</span>
          </label>
          <span class="loop-opts" id="loopOpts" hidden>
            <label class="multiplicity-picker" title="Loop order of the generated list. Two loops is practical for up to four external particles; for more, add loops one at a time by right-clicking a diagram.">
              <span>Loops</span>
              <select id="loopOrder"><option value="1">1</option><option value="2">2</option></select>
            </label>
            <label class="multiplicity-picker" title="Unitary gauge: physical W, Z, H only. 't Hooft–Feynman gauge: adds the Goldstone bosons and electroweak ghosts that run in loops.">
              <span>Gauge</span>
              <select id="loopGauge"><option value="unitary">unitary</option><option value="feynman">'t Hooft–Feynman</option></select>
            </label>
            <label class="mode-toggle" title="Higgs tadpoles (photon, Z and gluon tadpoles vanish and are never shown)"><input type="checkbox" id="loopTadpoles"> <span>tadpoles</span></label>
            <label class="mode-toggle" title="Self-energies on external legs (amputated in the S-matrix; they enter through the LSZ factors)"><input type="checkbox" id="loopExternal"> <span>external-leg loops</span></label>
          </span>
          <label class="mode-toggle" title="When nothing connects these particles, look for diagrams that use one more external particle">
            <input type="checkbox" id="allowExtras"> <span>Allow additional external particles?</span>
          </label>
          <label class="mode-toggle" title="Give every quark, antiquark, gluon and hadron constituent an explicit colour, and draw the colour flow">
            <input type="checkbox" id="addColour"> <span>Add Color</span>
          </label>
          <label class="sqrt-s" title="Collision energy, used to check scattering thresholds. Leave empty to skip that check.">
            <span>√s</span>
            <input type="number" id="sqrtS" min="0" step="any" inputmode="decimal" placeholder="GeV">
          </label>
          <label class="multiplicity-picker" title="Which particles discovery may put in the final state (when the final state is empty)">
            <span>Discover</span>
            <select id="discoverFinals">
              <option value="">auto</option>
              <option value="elementary">elementary</option>
              <option value="hadrons">hadrons</option>
              <option value="both">both</option>
            </select>
          </label>
          <label class="multiplicity-picker">
            <span>Max final particles</span>
            <select id="maxMultiplicity">
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
            </select>
          </label>
          <button class="generate-btn" id="generateBtn"><i class="fas fa-bolt"></i> Generate</button>
        </div>
      </div>

      <div id="errorDisplay" class="error-message" style="display: none;"></div>

      <div class="canvas-box">
        <div class="legend">
          <span><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="26" y2="5" stroke="#1b221c" stroke-width="2"/></svg> Fermion</span>
          <span><svg width="30" height="12" aria-hidden="true"><path d="M0,6 Q3.75,0 7.5,6 T15,6 T22.5,6 T30,6" fill="none" stroke="#b45309" stroke-width="2"/></svg> Photon</span>
          <span><svg width="30" height="12" aria-hidden="true"><path d="M0,6 Q3.75,0 7.5,6 T15,6 T22.5,6 T30,6" fill="none" stroke="#e74c3c" stroke-width="2"/></svg> W</span>
          <span><svg width="30" height="12" aria-hidden="true"><path d="M0,6 Q3.75,0 7.5,6 T15,6 T22.5,6 T30,6" fill="none" stroke="#8e44ad" stroke-width="2"/></svg> Z</span>
          <span><svg width="30" height="15" aria-hidden="true"><path d="M0,7.5 C4,-2 10,-2 10,7.5 C10,17 4,17 4,7.5 C4,-2 14,-2 14,7.5 C14,17 8,17 8,7.5 C8,-2 18,-2 18,7.5 C18,17 12,17 12,7.5 C12,-2 22,-2 22,7.5 C22,17 16,17 16,7.5" fill="none" stroke="#27ae60" stroke-width="2"/></svg> Gluon</span>
          <span><svg width="30" height="10" aria-hidden="true"><line x1="0" y1="5" x2="30" y2="5" stroke="#4d5964" stroke-width="2" stroke-dasharray="7,5"/></svg> Higgs</span>
          <span title="'t Hooft–Feynman gauge only"><svg width="30" height="10" aria-hidden="true"><line x1="0" y1="5" x2="30" y2="5" stroke="#4d5964" stroke-width="2" stroke-dasharray="2.5,3.5,7,3.5"/></svg> Goldstone</span>
          <span><svg width="30" height="10" aria-hidden="true"><line x1="0" y1="5" x2="30" y2="5" stroke="#7a868e" stroke-width="2.4" stroke-dasharray="0.5,4.5" stroke-linecap="round"/></svg> ghost</span>
          <span><svg width="22" height="22" aria-hidden="true"><path d="M14,2 Q8,2 8,6 Q8,11 4,11 Q8,11 8,16 Q8,20 14,20" fill="none" stroke="#1f5e8e" stroke-width="2"/></svg> Hadron (valence quarks)</span>
          <span class="colour-legend"><i class="cdot" style="background:#d62828"></i><i class="cdot" style="background:#23944a"></i><i class="cdot" style="background:#1d5fd1"></i> colours · <i class="cdot" style="background:#0097a7"></i><i class="cdot" style="background:#b5179e"></i><i class="cdot" style="background:#c99400"></i> anticolours</span>
        </div>
        <div id="channelGrid" class="results" hidden></div>
        <div id="loopResults"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/loopchannel.js"></script>
</body>
</html>
